name: MariaDB compatibility

on:
  push:
    paths:
      - "artifacts/beyond-dashboards/php-security-hardening/database/security_audit.sql"
      - "artifacts/beyond-dashboards/php-security-hardening/README.md"
      - "artifacts/beyond-dashboards/php-security-hardening/tests/check-mariadb-image-pins.sh"
      - "artifacts/beyond-dashboards/php-security-hardening/tests/mysql-archive-permissions-matrix.sh"
      - "artifacts/beyond-dashboards/php-security-hardening/tests/mysql-archive-permissions.sh"
      - ".github/workflows/mariadb-compatibility.yml"
  pull_request:

permissions:
  contents: read

jobs:
  archive-permissions:
    name: MariaDB archive permissions matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect MariaDB compatibility changes
        id: compatibility-changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_matrix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not collapse renames: reporting the old path as a deletion keeps
          # protected files in scope when they are deleted or renamed away.
          if git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" \
            | grep -Eq '^(\.github/workflows/mariadb-compatibility\.yml|artifacts/beyond-dashboards/php-security-hardening/(README\.md|database/security_audit\.sql|tests/(check-mariadb-image-pins|mysql-archive-permissions(-matrix)?)\.sh))$'; then
            echo "run_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_matrix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pinned MariaDB compatibility matrix
        if: steps.compatibility-changes.outputs.run_matrix == 'true'
        run: bash artifacts/beyond-dashboards/php-security-hardening/tests/mysql-archive-permissions-matrix.sh

      - name: Record out-of-scope success
        if: steps.compatibility-changes.outputs.run_matrix != 'true'
        run: echo "No MariaDB compatibility-sensitive files changed."
